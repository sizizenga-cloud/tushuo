<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ee;--card:#fff;--tx:#2b2118;--ac:#e8590c;--bd:#f0d9bd;--chip:#fff0d9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1712;--card:#2a231b;--tx:#f6ece0;--ac:#ff8a3d;--bd:#4a3c2c;--chip:#3a2f23}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1712;--card:#2a231b;--tx:#f6ece0;--ac:#ff8a3d;--bd:#4a3c2c;--chip:#3a2f23}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 6px;text-align:center}
#ind{text-align:center;font-weight:700;color:var(--ac);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:var(--ac);color:#fff;cursor:pointer;width:100%}
button.alt{background:var(--chip);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.wrap{flex-wrap:wrap}.wrap>*{flex:1 1 30%}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);resize:vertical}
.chips{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:200px;overflow-y:auto}
.chips button{background:var(--chip);color:var(--tx);border:1px solid var(--bd);text-align:left;font-weight:500;font-size:17px;padding:10px 12px}
.tbox{border:2px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.tbox.on{border-color:var(--ac)}
.tbox .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px;font-size:16px}
.tbox .del{width:auto;padding:4px 12px;font-size:15px}
.sw{display:flex;gap:12px;margin:10px 0 12px}
.sw i{width:44px;height:44px;border-radius:50%;border:4px solid transparent;cursor:pointer;display:block}
.sw i.on{border-color:var(--ac)}
#out{width:min(100%,42vh);aspect-ratio:1/1;margin:0 auto;display:block;border-radius:12px}
#msg{min-height:26px;text-align:center;font-size:16px;margin:8px 0 0}
.mic.on{background:#d32f2f;color:#fff}
.step{display:none}.step.on{display:block}
.hint{font-size:15px;opacity:.75;margin:0 0 10px}
.sel.on{outline:3px solid var(--ac)}
</style></head><body><main>
<h1>☀️ 圖說</h1>
<div id="ind"></div>
<div class="card" id="pv"><img id="out" alt="預覽"></div>

<section class="step on" id="s1"><div class="card"><h2>① 選擇照片</h2>
<input id="file" type="file" accept="image/*" hidden>
<button id="pick" style="padding:56px 16px;font-size:26px">📷 點這裡選擇照片</button>
<p id="msg1" style="text-align:center;margin:12px 0 0"></p></div></section>

<section class="step" id="s2"><div class="card"><h2>② 輸入文字（可新增多段）</h2>
<div class="chips" id="chips"></div>
<div id="tl"></div>
<button class="alt" id="add">＋ 新增一段文字</button>
<div class="row"><button class="alt mic" id="mic">🎤 語音輸入</button><button class="alt" id="clr">清除這段</button></div>
<p id="msg2" style="text-align:center;margin:8px 0 0;font-size:16px"></p>
<div class="row"><button class="alt" data-go="1">← 上一步</button><button data-go="3">下一步 →</button></div></div></section>

<section class="step" id="s3"><div class="card"><h2>③ 調整並完成</h2>
<div class="row wrap" id="tsel" style="margin-top:0"></div>
<div class="sw" id="sw"></div>
<div class="row" style="margin-top:0"><button class="alt" id="small">A－ 縮小</button><button class="alt" id="big">A＋ 放大</button></div>
<p class="hint" style="margin-top:10px">用手指拖曳文字就能移動；上方可切換要調整的那一段。</p>
<button id="copy" style="margin-bottom:8px">💬 傳到 LINE</button>
<button class="alt" id="save">💾 儲存圖片</button>
<p id="msg"></p>
<div class="row"><button class="alt" data-go="2">← 上一步</button></div></div></section>
</main>
<div id="ov" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))"><p style="color:#fff;font-weight:700;text-align:center;margin:0;font-size:20px">長按下方圖片，選「加入照片」或「儲存影像」</p><img id="ovimg" alt="" style="max-width:100%;max-height:60vh;border-radius:12px"><button id="close" style="max-width:320px">完成</button></div>
<script>
const $=id=>document.getElementById(id);
const sugg=["早安！願你今天平安健康，笑口常開","早安！身體健康最重要，記得多喝水喔","早安！天氣變涼了，記得多穿衣服保暖","早安！祝您萬事如意，心想事成","早安！吃得好睡得好，快樂每一天","早安！愛笑的人運氣都不會太差","早安！今天也要開開心心，平安喜樂","早安！一日之計在於晨，今天加油"];
const cols=[["#ffeb3b","#d32f2f"],["#ffffff","#e53935"],["#ff1744","#ffffff"],["#ffffff","#1b5e20"]];
const titles=["選擇照片","輸入文字","調整並完成"];
const mkT=()=>({t:"",x:540,y:null,s:1,c:0});
let texts=[mkT()],sel=0,img=null,boxes=[],tas=[];
const cv=document.createElement("canvas");cv.width=cv.height=1080;
const ctx=cv.getContext("2d");
const FONT="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif";
function go(n){[1,2,3].forEach(i=>$("s"+i).classList.toggle("on",i===n));$("ind").textContent="步驟 "+n+"／3："+titles[n-1];$("out").classList.toggle("big",n===3);$("pv").style.display=n===3?"block":"none";if(n!==1)$("msg1").textContent="";if(n===3)renderSel();window.scrollTo(0,0)}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
sugg.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{texts[sel].t=s;tas[sel].value=s;draw()};$("chips").appendChild(b)});
cols.forEach((c,i)=>{const e=document.createElement("i");e.style.background=c[0];e.style.boxShadow="inset 0 0 0 4px "+c[1];e.onclick=()=>{texts[sel].c=i;mark();draw()};$("sw").appendChild(e)});
function mark(){[...$("sw").children].forEach((e,i)=>e.classList.toggle("on",i===texts[sel].c))}
function hl(){[...$("tl").children].forEach((e,i)=>e.classList.toggle("on",i===sel))}
function renderList(){
 const tl=$("tl");tl.innerHTML="";tas=[];
 texts.forEach((t,i)=>{
  const d=document.createElement("div");d.className="tbox";
  const hd=document.createElement("div");hd.className="hd";hd.innerHTML="<span>文字 "+(i+1)+"</span>";
  if(texts.length>1){const x=document.createElement("button");x.className="alt del";x.textContent="刪除";x.onclick=()=>{texts.splice(i,1);sel=Math.min(sel,texts.length-1);renderList();draw()};hd.appendChild(x)}
  const ta=document.createElement("textarea");ta.rows=2;ta.value=t.t;ta.placeholder="輸入文字…";
  ta.oninput=()=>{texts[i].t=ta.value;draw()};
  ta.onfocus=()=>{sel=i;hl();mark()};
  d.appendChild(hd);d.appendChild(ta);tl.appendChild(d);tas.push(ta);
 });
 hl();mark();
}
function renderSel(){
 const r=$("tsel");r.innerHTML="";
 texts.forEach((t,i)=>{const b=document.createElement("button");b.className="alt sel"+(i===sel?" on":"");b.textContent="文字"+(i+1)+(t.t.trim()?"："+t.t.trim().replace(/^早安！?/,"").slice(0,3):"");b.onclick=()=>{sel=i;renderSel();mark()};r.appendChild(b)});
 mark();
}
$("add").onclick=()=>{if(texts.length>=8){$("msg2").textContent="最多可以新增 8 段文字。";return}texts.push(mkT());sel=texts.length-1;renderList();tas[sel].focus()};
function wrap(t,maxW){const out=[];t.split("\n").forEach(p=>{let l="";for(const ch of p){if(ctx.measureText(l+ch).width>maxW&&l){out.push(l);l=ch}else l+=ch}out.push(l)});return out}
function draw(){
 const W=1080;boxes=[];
 if(img){const s=Math.max(W/img.width,W/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(W-w)/2,(W-h)/2,w,h)}
 else{const g=ctx.createLinearGradient(0,0,0,W);g.addColorStop(0,"#ffd27d");g.addColorStop(1,"#ff8f6b");ctx.fillStyle=g;ctx.fillRect(0,0,W,W);ctx.fillStyle="#fff3b0";ctx.beginPath();ctx.arc(540,330,150,0,7);ctx.fill()}
 texts.forEach((T,i)=>{
  const t=T.t.trim();if(!t){boxes[i]=null;return}
  const maxW=Math.max(300,Math.min(W-100,2*Math.min(T.x,W-T.x)-20));
  let size=Math.round(90*T.s),lines;
  for(;size>=20;size-=4){ctx.font="900 "+size+"px "+FONT;lines=wrap(t,maxW);if(lines.length*size*1.3<=1000)break}
  const lh=size*1.3,h=lines.length*lh;
  const cy=T.y===null?(i===0?W-80-h/2:150+(i-1)*130):T.y;
  const y=cy-h/2;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";ctx.lineWidth=size/5;
  let mw=0;
  lines.forEach((l,k)=>{const yy=y+lh*k+lh/2;mw=Math.max(mw,ctx.measureText(l).width);ctx.strokeStyle=cols[T.c][1];ctx.strokeText(l,T.x,yy);ctx.fillStyle=cols[T.c][0];ctx.fillText(l,T.x,yy)});
  boxes[i]={cx:T.x,cy:cy,w:mw,h:h};
 });
 $("out").src=cv.toDataURL("image/jpeg",.92);
}
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const i=new Image();
 i.onload=()=>{img=i;try{draw()}catch(err){$("msg1").textContent="預覽發生錯誤："+err.message}go(2)};
 i.onerror=()=>{$("msg1").textContent="這張照片讀取失敗，請換一張再試。"};
 i.src=URL.createObjectURL(f);
};
$("clr").onclick=()=>{texts[sel].t="";tas[sel].value="";draw()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$("mic").onclick=()=>{
 if(!SR){$("msg2").textContent="此瀏覽器不支援語音輸入，請改用鍵盤上的麥克風按鈕。";return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang="zh-TW";rec.interimResults=true;
 const k=sel,base=texts[k].t;
 $("mic").classList.add("on");$("mic").textContent="⏹ 聆聽中…點一下停止";
 rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;texts[k].t=base+s;if(tas[k])tas[k].value=base+s;draw()};
 rec.onend=rec.onerror=()=>{rec=null;$("mic").classList.remove("on");$("mic").textContent="🎤 語音輸入"};
 try{rec.start()}catch(_){rec=null}
};
$("big").onclick=()=>{texts[sel].s=Math.min(2.6,texts[sel].s+.15);draw()};
$("small").onclick=()=>{texts[sel].s=Math.max(.5,texts[sel].s-.15);draw()};
const o=$("out");let d=null,raf=0;
o.style.touchAction="none";
o.addEventListener("pointerdown",e=>{
 const r=o.getBoundingClientRect(),k=1080/r.width,px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k;
 let best=-1,bd=1e9;
 boxes.forEach((b,i)=>{if(!b)return;const inside=Math.abs(px-b.cx)<=b.w/2+30&&Math.abs(py-b.cy)<=b.h/2+30;const dist=inside?0:Math.hypot(px-b.cx,py-b.cy);if(dist<bd||(dist===bd&&inside)){bd=dist;best=i}});
 if(best<0)return;
 sel=best;renderSel();hl();
 d={x:e.clientX,y:e.clientY,tx:texts[best].x,ty:boxes[best].cy,i:best};
 o.setPointerCapture(e.pointerId);
});
o.addEventListener("pointermove",e=>{
 if(!d)return;const k=1080/o.getBoundingClientRect().width;
 const T=texts[d.i];
 T.x=Math.max(150,Math.min(930,d.tx+(e.clientX-d.x)*k));
 T.y=Math.max(60,Math.min(1020,d.ty+(e.clientY-d.y)*k));
 if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()});
});
["pointerup","pointercancel"].forEach(n=>o.addEventListener(n,()=>{d=null}));
$("save").onclick=()=>{cv.toBlob(b=>{const f=new File([b],"圖說.jpg",{type:"image/jpeg"});const ov=()=>{$("ovimg").src=URL.createObjectURL(b);$("ov").style.display="flex"};if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(e=>{if(e.name!=="AbortError")ov()})}else ov()},"image/jpeg",.92)};
$("close").onclick=()=>{$("ov").style.display="none"};
function reset(m){img=null;texts=[mkT()];sel=0;$("file").value="";renderList();draw();go(1);$("msg").textContent="";$("msg1").textContent=m}
$("copy").onclick=()=>{
 cv.toBlob(async b=>{
  const f=new File([b],"圖說.jpg",{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   try{await navigator.share({files:[f]});reset("✅ 已傳送！可以再製作下一張。");return}catch(e){if(e.name==="AbortError")return}
  }
  try{
   await navigator.clipboard.write([new ClipboardItem({"image/png":new Promise(r=>cv.toBlob(r,"image/png"))})]);
   const w=window.open("https://line.me/R/nv/chat","_blank");if(!w)location.href="https://line.me/R/nv/chat";
   reset("✅ 圖片已複製！到 LINE 聊天室長按輸入框貼上，再回來製作下一張。");
  }catch(_){$("msg").textContent="無法直接傳到 LINE，請改按「儲存圖片」，再從 LINE 選照片傳送。"}
 },"image/jpeg",.92)};
renderList();draw();go(1);
</script></body></html>
